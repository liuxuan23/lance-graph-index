[package]
name = "lance-graph-benches"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-graph (not published)"

[dependencies]
async-trait = "0.1"
lance-graph = { path = "../lance-graph", version = "0.5.3" }
lance = "1.0.0"
lance-index = "1.0.0"
arrow-array = "56.2"
arrow-schema = "56.2"
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
datafusion = { version = "50.3", default-features = false, features = ["parquet"] }
libc = "0.2"
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "graph_execution"
path = "benches/execution/graph_execution.rs"
harness = false

[[bench]]
name = "graph_execution_disk"
path = "benches/execution/graph_execution_disk.rs"
harness = false

[[bench]]
name = "graph_index_build"
path = "benches/indexed_expand/graph_index_build.rs"
harness = false

[[bench]]
name = "indexed_expand_star"
path = "benches/indexed_expand/star.rs"
harness = false

[[bench]]
name = "indexed_expand_target_join"
path = "benches/indexed_expand/target_join_cost.rs"
harness = false

[[bench]]
name = "persisted_csr_index"
path = "benches/indexed_expand/persisted_index.rs"
harness = false

[[bench]]
name = "direct_adjacency_index"
path = "benches/indexed_expand/direct_adjacency.rs"
harness = false

[[bench]]
name = "multi_type_direct_adjacency"
path = "benches/indexed_expand/multi_type_direct_adjacency.rs"
harness = false

[[bench]]
name = "covering_adjacency"
path = "benches/indexed_expand/covering_adjacency.rs"
harness = false
